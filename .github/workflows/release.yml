name: Release

on:
  push:
    branches: [main]
    paths:
      - custom_components/print_log/manifest.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version from manifest
        id: v
        run: |
          version=$(python3 -c "import json; print(json.load(open('custom_components/print_log/manifest.json'))['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Create release when the tag does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${{ steps.v.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --generate-notes
